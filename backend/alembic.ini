# Alembic configuration.
#
# Note: sqlalchemy.url is deliberately NOT set here. The database URL is
# read from the DATABASE_URL environment variable inside alembic/env.py,
# via the same pydantic settings object the app uses. Keeping it out of
# this file means credentials never land in version control, and local
# and production runs use identical config resolution.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
